<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Machine Shop - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d; 
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* Prevents any horizontal scrollbars on mobile */
        }

        /* Top 50% section */
        .top-half {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Image constrained to fit within top half */
        .top-half img {
            max-height: 40vh;
            max-width: 90vw;
            width: auto;
            object-fit: contain;
            mix-blend-mode: screen; /* Keeps black background transparent */
        }

        /* Bottom 50% section */
        .bottom-half {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
        }

        /* Responsive Text: Clamps between 2.5rem (mobile) and 8rem (desktop) */
        .coming-soon {
            font-size: clamp(2.8rem, 8vw, 8rem); 
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            text-transform: uppercase;
            text-align: center;
            color: #f26522;
            
            /* Forces clean stacking on narrow mobile displays */
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .coming-soon {
                /* On small screens, force "COMING" and "SOON" onto separate lines cleanly */
                display: block;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

    <!-- Top 50%: Logo Centered -->
    <div class="top-half">
        <img src="IMG-20260727-WA0001.jpg" alt="Little Machine Shop Logo">
    </div>

    <!-- Bottom 50%: Coming Soon Centered -->
    <div class="bottom-half">
        <h1 class="coming-soon">COMING<br>SOON</h1>
    </div>

</body>
</html>
